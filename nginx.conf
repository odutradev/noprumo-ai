map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(?:png|svg|ico|webmanifest|xml|txt)$ "public, max-age=86400";
    default "no-cache";
}

map $request_uri $robots_tag {
    ~^/brand(?:[/?]|$) "noindex, nofollow";
    default "";
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /gerador {
        return 301 /generator$is_args$args;
    }

    location = /id {
        return 301 /brand$is_args$args;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(?:generator|brand)/?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
