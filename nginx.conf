server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /id {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
